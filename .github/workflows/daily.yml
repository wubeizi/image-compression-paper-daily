name: Daily Image Compression Papers

on:
  schedule:
    # Every day at 09:10 Asia/Tokyo.
    - cron: "10 9 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update papers
        env:
          PAPER_TIMEZONE: Asia/Tokyo
          LOOKBACK_DAYS: "60"
          PER_QUERY: "25"
          PER_TOPIC: "15"
          ARXIV_DELAY: "3"
          OPENALEX_DELAY: "0.5"
          # Optional repository variable: CONTACT_EMAIL
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: python paper_daily.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md papers.json history.json
          git diff --cached --quiet || git commit -m "chore: update daily papers"
          git push
