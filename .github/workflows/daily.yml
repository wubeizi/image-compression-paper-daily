name: Update and Deploy Image Compression Papers

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 9 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Collect papers
        if: github.event_name != 'push'
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PAPER_TIMEZONE: Asia/Tokyo
          LOOKBACK_DAYS: "30"
          SCHOLAR_NUM: "20"
          PER_TOPIC: "12"
        run: python paper_daily.py

      - name: Commit updated paper database
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md papers.json history.json docs/index.md
          git diff --cached --quiet || git commit -m "Update daily image compression papers"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
