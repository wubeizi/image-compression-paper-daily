name: Daily Image Compression Papers

on:
  schedule:
    - cron: "10 9 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PAPER_TIMEZONE: Asia/Tokyo
          LOOKBACK_DAYS: "30"
          SCHOLAR_NUM: "20"
          PER_TOPIC: "12"
        run: python paper_daily.py

      - name: Commit updated paper database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md papers.json history.json
          git diff --cached --quiet || git commit -m "Update daily image compression papers"
          git push
